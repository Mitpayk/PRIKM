<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MongoDB HA Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;
  --card:#ffffff;
  --border:#dcdfe4;
  --text:#222;
  --muted:#666;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}
.container{max-width:1200px;margin:auto}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.logo-title{font-size:28px;font-weight:bold}
.logo-sub,#clock,.live-badge{color:var(--muted);font-size:14px}
.section-label,.panel-title{font-weight:bold;margin-bottom:10px}
.cluster-grid,.two-col{
  display:grid;
  gap:15px;
}
.cluster-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:20px}
.two-col{grid-template-columns:1fr 1fr}
.node-card,.panel,.summary-bar{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:15px;
}
.node-card.primary{border-left:5px solid var(--primary)}
.node-card.secondary{border-left:5px solid var(--success)}
.node-card.down{border-left:5px solid var(--danger)}
.node-role{
  display:inline-block;
  margin:8px 0;
  padding:4px 8px;
  border-radius:4px;
  background:#eef2ff;
}
.summary-bar{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.stat-val{font-size:24px;font-weight:bold}
.add-form{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.add-input{
  flex:1;
  padding:10px;
  border:1px solid var(--border);
  border-radius:6px;
}
.btn{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:var(--primary);
  color:white;
  cursor:pointer;
}
.items-list,.log-body{max-height:400px;overflow:auto}
.item-row{
  display:flex;
  gap:10px;
  padding:12px 15px;
  border-bottom:1px solid var(--border);
}
.item-body{flex:1}
.item-del{
  border:none;
  background:none;
  color:var(--danger);
  cursor:pointer;
}
.log-line{padding:4px 0;font-size:13px}
.empty-state{text-align:center;padding:30px;color:var(--muted)}
#error-banner{
  display:none;
  padding:10px;
  margin-bottom:15px;
  background:#fee2e2;
  border:1px solid #fecaca;
  border-radius:6px;
}
@media(max-width:768px){
  .two-col{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-title">// MONGO·HA·MONITOR</div>
      <div class="logo-sub">ReplicaSet · rs0 · High Availability</div>
    </div>
    <div class="header-right">
      <div class="live-badge">
        <span class="live-dot" id="live-dot"></span>
        <span id="live-label">LIVE</span>
      </div>
      <div id="clock">--:--:--</div>
    </div>
  </header>

  <div id="error-banner"></div>

  <div class="section-label">// cluster nodes</div>
  <div class="cluster-grid" id="cluster-grid">
    <div class="node-card"><div class="node-name">—</div><div class="node-role role-unknown">…</div></div>
    <div class="node-card"><div class="node-name">—</div><div class="node-role role-unknown">…</div></div>
    <div class="node-card"><div class="node-name">—</div><div class="node-role role-unknown">…</div></div>
  </div>

  <div class="summary-bar">
    <div class="stat">
      <div class="stat-val" id="stat-primary">—</div>
      <div class="stat-label">Primary Node</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-val" id="stat-docs">—</div>
      <div class="stat-label">Documents</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-val" id="stat-up">—</div>
      <div class="stat-label">Nodes Up</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-val" id="stat-refresh">—</div>
      <div class="stat-label">Last Refresh</div>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">// Collection: appdb.items</div>
        <div class="count-badge" id="items-count">0</div>
      </div>
      <div class="add-form">
        <input class="add-input" id="item-input" placeholder="Текст нового запису…" maxlength="200">
        <button class="btn" id="add-btn" onclick="addItem()">ADD</button>
      </div>
      <div class="items-list" id="items-list">
        <div class="empty-state">— порожньо —</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">// Event Log</div>
        <button class="btn" style="padding:4px 10px;font-size:10px;background:transparent;color:var(--text-dim);border:1px solid var(--border);" onclick="clearLog()">CLEAR</button>
      </div>
      <div class="log-body" id="log-body">
        <div class="log-line info">
          <span class="log-time">--:--:--</span>
          <span class="log-msg">Ініціалізація…</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const REFRESH_INTERVAL = 3000;
let lastPrimary = null;

function log(msg, type = '') {
  const body = document.getElementById('log-body');
  const t = new Date().toLocaleTimeString('uk-UA');
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.innerHTML = `<span class="log-time">${t}</span><span class="log-msg">${msg}</span>`;
  body.prepend(line);
  while (body.children.length > 80) body.removeChild(body.lastChild);
}

function formatUptime(s) {
  if (s == null) return '—';
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m ${s%60}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}

async function fetchStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();

    const dot = document.getElementById('live-dot');
    const banner = document.getElementById('error-banner');

    if (!data.ok) {
      dot.className = 'live-dot dead';
      document.getElementById('live-label').textContent = 'ERROR';
      banner.style.display = 'block';
      banner.textContent = `⚠ DB недоступна: ${data.error}`;
      log(`БД недоступна: ${data.error}`, 'err');
      renderNodesDown();
      return;
    }

    dot.className = 'live-dot';
    document.getElementById('live-label').textContent = 'LIVE';
    banner.style.display = 'none';

    renderNodes(data.members);

    const primary = data.primary || '—';
    document.getElementById('stat-primary').textContent =
      primary !== '—' ? primary.split(':')[0] : '—';

    const up = data.members.filter(m => m.health === 1).length;
    document.getElementById('stat-up').textContent = `${up} / ${data.members.length}`;
    document.getElementById('stat-refresh').textContent = new Date().toLocaleTimeString('uk-UA');

    // detect primary change
    if (lastPrimary && lastPrimary !== data.primary && data.primary) {
      log(`⚡ Новий primary: ${data.primary} (був: ${lastPrimary})`, 'warn');
    }
    lastPrimary = data.primary;

  } catch (err) {
    log(`Помилка запиту: ${err.message}`, 'err');
  }
}

function renderNodes(members) {
  const grid = document.getElementById('cluster-grid');
  grid.innerHTML = '';
  members.forEach(m => {
    const card = document.createElement('div');
    let cls = 'node-card';
    let roleCls = 'role-unknown';
    let roleText = m.state;
    if (m.state === 'PRIMARY') { cls += ' primary'; roleCls = 'role-primary'; }
    else if (m.state === 'SECONDARY') { cls += ' secondary'; roleCls = 'role-secondary'; }
    else if (m.health === 0) { cls += ' down'; roleCls = 'role-down'; }

    card.className = cls;
    card.innerHTML = `
      <div class="node-name">${m.name}</div>
      <div class="node-role ${roleCls}">${roleText}</div>
      <div class="node-uptime">uptime: ${formatUptime(m.uptime)}</div>
    `;
    grid.appendChild(card);
  });
}

function renderNodesDown() {
  const grid = document.getElementById('cluster-grid');
  [...grid.children].forEach(c => {
    c.className = 'node-card down';
    const role = c.querySelector('.node-role');
    if (role) { role.className = 'node-role role-down'; role.textContent = 'UNREACHABLE'; }
  });
}


async function fetchItems() {
  try {
    const res = await fetch('/api/items');
    const data = await res.json();
    const list = document.getElementById('items-list');
    const countBadge = document.getElementById('items-count');

    if (!data.ok || !data.items.length) {
      list.innerHTML = '<div class="empty-state">— порожньо —</div>';
      countBadge.textContent = '0';
      document.getElementById('stat-docs').textContent = '0';
      return;
    }

    countBadge.textContent = data.items.length;
    document.getElementById('stat-docs').textContent = data.items.length;

    list.innerHTML = '';
    data.items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      const d = new Date(item.createdAt);
      const dateStr = d.toLocaleString('uk-UA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      row.innerHTML = `
        <div class="item-idx">${String(i + 1).padStart(2,'0')}</div>
        <div class="item-body">
          <div class="item-text">${escHtml(item.text)}</div>
          <div class="item-meta">${item._id} · ${dateStr}</div>
        </div>
        <button class="item-del" onclick="deleteItem('${item._id}')" title="Видалити">×</button>
      `;
      list.appendChild(row);
    });
  } catch (err) {
    log(`Помилка завантаження: ${err.message}`, 'err');
  }
}

async function addItem() {
  const input = document.getElementById('item-input');
  const text = input.value.trim();
  if (!text) return;
  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.ok) {
      input.value = '';
      log(`Додано запис: "${text.substring(0,40)}"`, 'ok');
      await fetchItems();
    } else {
      log(`Помилка запису: ${data.error}`, 'err');
    }
  } catch (err) {
    log(`Помилка: ${err.message}`, 'err');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

async function deleteItem(id) {
  try {
    const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.ok) {
      log(`Видалено: ${id}`, 'warn');
      await fetchItems();
    }
  } catch (err) {
    log(`Помилка видалення: ${err.message}`, 'err');
  }
}

function clearLog() {
  document.getElementById('log-body').innerHTML = '';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


document.getElementById('item-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});


log('Підключення до MongoDB…', 'info');
fetchStatus();
fetchItems();

setInterval(() => {
  fetchStatus();
  fetchItems();
}, REFRESH_INTERVAL);
</script>
</body>
</html>
