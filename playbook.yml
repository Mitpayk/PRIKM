- name: Configure App Node
  hosts: app_node
  become: yes
  tasks:
    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run App container
      docker_container:
        name: app_node
        image: mitpayk/my-nginx:latest
        state: started
        restart_policy: always
        networks:
          - name: lab8_network
        ports:
          - "8081:80"

    - name: Run Node Exporter
      docker_container:
        name: node_exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: always
        networks:
          - name: lab8_network
        ports:
          - "9100:9100"

- name: Configure Monitor Node
  hosts: monitor_node
  become: yes
  tasks:
    - name: Run Prometheus
      docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        networks:
          - name: lab8_network
        ports:
          - "9090:9090"
        volumes:
          - "/home/vagrant/lab8/prometheus.yml:/etc/prometheus/prometheus.yml"

    - name: Run Grafana
      docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        networks:
          - name: lab8_network
        ports:
          - "3000:3000"
