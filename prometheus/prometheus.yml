global:
  scrape_interval: 120s
  evaluation_interval: 120s

  external_labels:
    monitor: 'my-project'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'

  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: 'jenkins'
    metrics_path: '/prometheus/'
    basic_auth:
      username: 'admin'
      password: '1137bd8c078f548aa1c946911aabe31a6b'
    
    static_configs:
      - targets:
          - '172.18.0.1:8080'
